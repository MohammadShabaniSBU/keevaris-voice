services:
  voice:
    build: .
    container_name: keevaris-voice
    networks:
      - traefik-network
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keevaris-voice.rule=Host(`voice.test2.keevaris.local`)"
      - "traefik.http.routers.keevaris-voice.service=keevaris-voice"
      - "traefik.http.services.keevaris-voice.loadbalancer.server.port=8787"
      - "traefik.docker.network=traefik-network"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  traefik-network:
    external: true
